name: Build XBuddy Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd android

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Building Release APK with signing secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            ./gradlew assembleRelease --no-daemon

            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$UNSIGNED_APK" ]; then
              echo "Error: Unsigned release APK not found at $UNSIGNED_APK"
              exit 1
            fi

            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Android build tools from $BUILD_TOOLS_DIR"

            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" aligned-release.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out ../XBuddy.apk aligned-release.apk

            $BUILD_TOOLS_DIR/apksigner verify ../XBuddy.apk
            rm -f release.keystore aligned-release.apk
            echo "Release APK signed and verified as XBuddy.apk"
          else
            echo "Notice: Release keystore secrets not found. Building APK with debug key for testing..."
            ./gradlew assembleDebug --no-daemon
            DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
            if [ ! -f "$DEBUG_APK" ]; then
              echo "Error: Debug APK not found at $DEBUG_APK"
              exit 1
            fi
            cp "$DEBUG_APK" ../XBuddy.apk
            echo "Debug APK built and copied as XBuddy.apk"
          fi

          cd ..
          if [ ! -f "XBuddy.apk" ]; then
            echo "Error: XBuddy.apk was not generated!"
            exit 1
          fi
          echo "XBuddy.apk build successful! Size: $(ls -lh XBuddy.apk | awk '{print $5}')"

      - name: Generate Version Tag
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated release tag: $VERSION"

      - name: Publish XBuddy.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "X Buddy Android ${{ steps.versioning.outputs.tag }}"
          body: |
            ## 📱 X Buddy Official Android App

            - **Version:** `${{ steps.versioning.outputs.tag }}`
            - **Package ID:** `com.xbuddy.app`
            - **Commit:** `${{ github.sha }}`
            - **Build Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

            ### 🚀 Stable Download Link
            Download the latest APK anytime via the permanent stable URL:
            👉 **[Download XBuddy.apk](https://github.com/${{ github.repository }}/releases/latest/download/XBuddy.apk)**
          files: XBuddy.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
